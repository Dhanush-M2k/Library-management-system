<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Process Return - Library MS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f0f4ff 0%, #dce7f3 100%); min-height: 100vh; font-family: Inter, sans-serif; }
        .navbar { background: linear-gradient(90deg, #1e3a5f 0%, #2563eb 100%); }
        .nav-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
        .nav-link { color: rgba(255,255,255,0.85) !important; font-weight: 500; }
        .form-card { background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 2.5rem; margin-top: 2rem; max-width: 600px; }
        .form-label { font-weight: 600; font-size: 0.875rem; color: #374151; }
        .info-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 12px 16px; font-size: 0.875rem; color: #991b1b; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-2">
    <div class="container">
        <a class="navbar-brand nav-brand" href="/dashboard"><i class="bi bi-book-half me-2"></i>LibraryMS</a>
        <div class="collapse navbar-collapse"><ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/books">Books</a></li>
            <li class="nav-item"><a class="nav-link" href="/members">Members</a></li>
            <li class="nav-item"><a class="nav-link" href="/orders">Orders</a></li>
            <li class="nav-item"><a class="nav-link" href="/returns">Returns</a></li>
        </ul></div>
    </div>
</nav>
<div class="container">
    <div class="form-card mx-auto">
        <h4 class="fw-bold mb-2"><i class="bi bi-arrow-return-left text-danger me-2"></i>Process Book Return</h4>
        <div class="info-box mb-4"><i class="bi bi-exclamation-circle me-1"></i>Fine is automatically calculated at ₹5/day for overdue books. Available copies will be restored.</div>
        <form th:action="@{/returns}" method="post">
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label">Select Order (Issued Books) *</label>
                    <select class="form-select" name="orderId" required>
                        <option value="">-- Select Order --</option>
                        <option th:each="o : ${orders}" th:value="${o.id}"
                                th:text="'Order #' + ${o.id} + ' — ' + ${o.member.name} + ' → ' + ${o.book.title} + ' (Due: ' + ${o.dueDate} + ')'"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Book Condition *</label>
                    <select class="form-select" name="bookCondition" required>
                        <option value="GOOD">Good</option>
                        <option value="DAMAGED">Damaged</option>
                        <option value="LOST">Lost</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Remarks</label>
                    <textarea class="form-control" name="remarks" rows="2" placeholder="Any notes about the return..."></textarea>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-danger px-4"><i class="bi bi-check-circle me-1"></i>Process Return</button>
                <a href="/returns" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
