<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Members - Library MS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f0f4ff 0%, #dce7f3 100%); min-height: 100vh; font-family: Inter, sans-serif; }
        .navbar { background: linear-gradient(90deg, #1e3a5f 0%, #2563eb 100%); }
        .nav-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
        .nav-link { color: rgba(255,255,255,0.85) !important; font-weight: 500; }
        .management-card { background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 2.5rem; margin-top: 2rem; }
        .table th { font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: .05em; padding: 1rem 1.25rem; background: #1e3a5f; color: #fff; }
        .table td { padding: .9rem 1.25rem; vertical-align: middle; }
        .table-hover tbody tr:hover { background-color: #f1f5f9; }
        .badge-status { padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; }
        .badge-active { background:#dcfce7; color:#166534; }
        .badge-expired { background:#fee2e2; color:#991b1b; }
        .badge-suspended { background:#fef9c3; color:#854d0e; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-2">
    <div class="container">
        <a class="navbar-brand nav-brand" href="/dashboard"><i class="bi bi-book-half me-2"></i>LibraryMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navMenu"><ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/books">Books</a></li>
            <li class="nav-item"><a class="nav-link fw-bold text-white" href="/members">Members</a></li>
            <li class="nav-item"><a class="nav-link" href="/orders">Book Orders</a></li>
            <li class="nav-item"><a class="nav-link" href="/returns">Returns</a></li>
            <li class="nav-item"><a class="nav-link" href="/students">Students</a></li>
        </ul></div>
    </div>
</nav>
<div class="container">
    <div class="management-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0"><i class="bi bi-people-fill text-success me-2"></i>Membership Table</h4>
            <a href="/members/new" class="btn btn-success"><i class="bi bi-person-plus me-1"></i>Register Member</a>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" th:text="${errorMessage}" role="alert"></div>
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" th:text="${successMessage}" role="alert"></div>
        <div class="table-responsive">
            <table class="table table-hover table-bordered">
                <thead><tr>
                    <th>#</th><th>Name</th><th>Email</th><th>Phone</th>
                    <th>Type</th><th>Start Date</th><th>End Date</th><th>Status</th><th>Actions</th>
                </tr></thead>
                <tbody>
                <tr th:each="member : ${members}">
                    <td th:text="${member.id}"></td>
                    <td class="fw-semibold" th:text="${member.name}"></td>
                    <td th:text="${member.email}"></td>
                    <td th:text="${member.phone}"></td>
                    <td><span class="badge bg-secondary" th:text="${member.membershipType}"></span></td>
                    <td th:text="${member.membershipStartDate}"></td>
                    <td th:text="${member.membershipEndDate}"></td>
                    <td>
                        <span class="badge-status" 
                              th:classappend="${member.status == 'ACTIVE'} ? 'badge-active' : (${member.status == 'EXPIRED'} ? 'badge-expired' : 'badge-suspended')"
                              th:text="${member.status}"></span>
                    </td>
                    <td>
                        <a th:href="@{/members/edit/{id}(id=${member.id})}" class="btn btn-sm btn-outline-info"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{/members/delete/{id}(id=${member.id})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Delete this member?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(members)}">
                    <td colspan="9" class="text-center text-muted py-4">No members found. <a href="/members/new">Register a member</a>.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
