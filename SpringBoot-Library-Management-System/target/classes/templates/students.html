<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students - Library MS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f0f4ff 0%, #dce7f3 100%); min-height: 100vh; font-family: Inter, sans-serif; }
        .navbar { background: linear-gradient(90deg, #1e3a5f 0%, #2563eb 100%); }
        .nav-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
        .nav-link { color: rgba(255,255,255,0.85) !important; font-weight: 500; }
        .management-card { background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 2.5rem; margin-top: 2rem; }
        .table th { font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: .05em; padding: 1rem 1.25rem; background: #1e3a5f; color: #fff; }
        .table td { padding: .9rem 1.25rem; vertical-align: middle; }
        .table-hover tbody tr:hover { background-color: #f1f5f9; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-2">
    <div class="container">
        <a class="navbar-brand nav-brand" href="/dashboard"><i class="bi bi-book-half me-2"></i>LibraryMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navMenu"><ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/books">Books</a></li>
            <li class="nav-item"><a class="nav-link" href="/members">Members</a></li>
            <li class="nav-item"><a class="nav-link" href="/orders">Book Orders</a></li>
            <li class="nav-item"><a class="nav-link" href="/returns">Returns</a></li>
            <li class="nav-item"><a class="nav-link fw-bold text-white" href="/students">Students</a></li>
        </ul></div>
    </div>
</nav>
<div class="container">
    <div class="management-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0"><i class="bi bi-mortarboard-fill text-primary me-2"></i>Student Records</h4>
            <a th:href="@{/students/new}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Add Student</a>
        </div>
        <div class="table-responsive">
            <table class="table table-hover table-bordered">
                <thead><tr>
                    <th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Roll Number</th><th>Department</th><th>Actions</th>
                </tr></thead>
                <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.id}"></td>
                    <td class="fw-semibold" th:text="${student.name}"></td>
                    <td th:text="${student.email}"></td>
                    <td th:text="${student.course}"></td>
                    <td th:text="${student.rollNumber}"></td>
                    <td th:text="${student.department}"></td>
                    <td>
                        <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-sm btn-outline-info"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{/students/delete/{id}(id=${student.id})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Are you sure you want to delete this student?');"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="7" class="text-center text-muted py-4">No students found. <a href="/students/new">Add a student</a>.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
