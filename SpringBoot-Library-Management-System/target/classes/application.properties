# ===============================
# = DATA SOURCE
# All values can be overridden with environment variables so the same
# jar/image runs locally, in Docker, and on Render without code changes.
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================
# Automatically create/update tables based on entity classes
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Show SQL statements in the console (useful for debugging; turn off in prod)
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Pretty print SQL in logs
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# = SERVER
# Render (and most PaaS providers) inject a PORT env var the app must
# bind to. Falls back to 8080 for local development.
# ===============================
server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=Library Management System
