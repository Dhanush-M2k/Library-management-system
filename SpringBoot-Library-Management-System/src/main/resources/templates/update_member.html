<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Edit Member - Library MS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <style>
        body { background: linear-gradient(135deg, #f0f4ff 0%, #dce7f3 100%); min-height: 100vh; font-family: Inter, sans-serif; }
        .navbar { background: linear-gradient(90deg, #1e3a5f 0%, #2563eb 100%); }
        .nav-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
        .nav-link { color: rgba(255,255,255,0.85) !important; font-weight: 500; }
        .form-card { background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 2.5rem; margin-top: 2rem; max-width: 700px; }
        .form-label { font-weight: 600; font-size: 0.875rem; color: #374151; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-2">
    <div class="container">
        <a class="navbar-brand nav-brand" href="/dashboard">LibraryMS</a>
        <div class="collapse navbar-collapse"><ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/members">Members</a></li>
        </ul></div>
    </div>
</nav>
<div class="container">
    <div class="form-card mx-auto">
        <h4 class="fw-bold mb-4">Edit Member</h4>
        <form th:action="@{/members/update/{id}(id=${member.id})}" th:object="${member}" method="post">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Full Name</label><input type="text" class="form-control" th:field="*{name}" required></div>
                <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" th:field="*{email}" required></div>
                <div class="col-md-6"><label class="form-label">Phone</label><input type="text" class="form-control" th:field="*{phone}"></div>
                <div class="col-md-6"><label class="form-label">Membership Type</label>
                    <select class="form-select" th:field="*{membershipType}">
                        <option value="STUDENT">Student</option><option value="BASIC">Basic</option><option value="PREMIUM">Premium</option>
                    </select>
                </div>
                <div class="col-12"><label class="form-label">Address</label><textarea class="form-control" th:field="*{address}" rows="2"></textarea></div>
                <div class="col-md-6"><label class="form-label">Start Date</label><input type="date" class="form-control" th:field="*{membershipStartDate}"></div>
                <div class="col-md-6"><label class="form-label">End Date</label><input type="date" class="form-control" th:field="*{membershipEndDate}"></div>
                <div class="col-md-6"><label class="form-label">Status</label>
                    <select class="form-select" th:field="*{status}">
                        <option value="ACTIVE">Active</option><option value="EXPIRED">Expired</option><option value="SUSPENDED">Suspended</option>
                    </select>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-warning px-4">Update Member</button>
                <a href="/members" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
