<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Issue a Book - Library MS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f0f4ff 0%, #dce7f3 100%); min-height: 100vh; font-family: Inter, sans-serif; }
        .navbar { background: linear-gradient(90deg, #1e3a5f 0%, #2563eb 100%); }
        .nav-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
        .nav-link { color: rgba(255,255,255,0.85) !important; font-weight: 500; }
        .form-card { background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 2.5rem; margin-top: 2rem; max-width: 600px; }
        .form-label { font-weight: 600; font-size: 0.875rem; color: #374151; }
        .info-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 12px 16px; font-size: 0.875rem; color: #854d0e; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-2">
    <div class="container">
        <a class="navbar-brand nav-brand" href="/dashboard"><i class="bi bi-book-half me-2"></i>LibraryMS</a>
        <div class="collapse navbar-collapse"><ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/books">Books</a></li>
            <li class="nav-item"><a class="nav-link" href="/members">Members</a></li>
            <li class="nav-item"><a class="nav-link fw-bold text-white" href="/orders">Book Orders</a></li>
            <li class="nav-item"><a class="nav-link" href="/returns">Returns</a></li>
            <li class="nav-item"><a class="nav-link" href="/students">Students</a></li>
        </ul></div>
    </div>
</nav>
<div class="container">
    <div class="form-card mx-auto">
        <h4 class="fw-bold mb-2"><i class="bi bi-cart-check-fill text-warning me-2"></i>Issue a Book</h4>
        <div class="info-box mb-4"><i class="bi bi-info-circle me-1"></i>Due date is automatically set to 14 days from today.</div>
        <form th:action="@{/orders}" th:object="${order}" method="post">
            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label">Member *</label>
                    <select class="form-select" name="memberId" required>
                        <option value="">-- Select Member --</option>
                        <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name} + ' (' + ${m.membershipType} + ')'"></option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Book *</label>
                    <select class="form-select" name="bookId" required>
                        <option value="">-- Select Book --</option>
                        <option th:each="b : ${books}" th:value="${b.id}"
                                th:text="${b.title} + ' — ' + ${b.author} + ' (' + ${b.availableCopies} + ' available)'"
                                th:disabled="${b.availableCopies == 0}"></option>
                    </select>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-warning text-dark px-4"><i class="bi bi-check-circle me-1"></i>Issue Book</button>
                <a href="/orders" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
