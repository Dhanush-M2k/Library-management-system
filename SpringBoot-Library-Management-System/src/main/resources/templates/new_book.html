<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Add Book - Library MS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f0f4ff 0%, #dce7f3 100%); min-height: 100vh; font-family: Inter, sans-serif; }
        .navbar { background: linear-gradient(90deg, #1e3a5f 0%, #2563eb 100%); }
        .nav-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
        .nav-link { color: rgba(255,255,255,0.85) !important; font-weight: 500; }
        .form-card { background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 2.5rem; margin-top: 2rem; max-width: 700px; }
        .form-label { font-weight: 600; font-size: 0.875rem; color: #374151; }
        .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-2">
    <div class="container">
        <a class="navbar-brand nav-brand" href="/dashboard"><i class="bi bi-book-half me-2"></i>LibraryMS</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/books">Books</a></li>
                <li class="nav-item"><a class="nav-link" href="/members">Members</a></li>
                <li class="nav-item"><a class="nav-link" href="/orders">Book Orders</a></li>
                <li class="nav-item"><a class="nav-link" href="/returns">Returns</a></li>
                <li class="nav-item"><a class="nav-link" href="/students">Students</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div class="form-card mx-auto">
        <h4 class="fw-bold mb-4"><i class="bi bi-journal-plus text-primary me-2"></i>Add New Book</h4>
        <form th:action="@{/books}" th:object="${book}" method="post">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">Book Title *</label>
                    <input type="text" class="form-control" th:field="*{title}" placeholder="e.g. Clean Code" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Genre *</label>
                    <select class="form-select" th:field="*{genre}" required>
                        <option value="" disabled selected>Select Genre</option>
                        <option value="Fiction">Fiction</option>
                        <option value="Non-Fiction">Non-Fiction</option>
                        <option value="Science">Science</option>
                        <option value="Technology">Technology</option>
                        <option value="History">History</option>
                        <option value="Biography">Biography</option>
                        <option value="Self-Help">Self-Help</option>
                        <option value="Academic">Academic</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Author *</label>
                    <input type="text" class="form-control" th:field="*{author}" placeholder="Author name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">ISBN *</label>
                    <input type="text" class="form-control" th:field="*{isbn}" placeholder="978-XXXXXXXXXX" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Publisher</label>
                    <input type="text" class="form-control" th:field="*{publisher}" placeholder="Publisher name">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Published Year</label>
                    <input type="number" class="form-control" th:field="*{publishedYear}" placeholder="2024" min="1900" max="2099">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Total Copies *</label>
                    <input type="number" class="form-control" th:field="*{totalCopies}" placeholder="5" min="1" required>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i>Save Book</button>
                <a href="/books" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-1"></i>Cancel</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
