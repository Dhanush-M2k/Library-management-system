<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
		  <style>
		          body {
		              /* Smooth background image with a dark overlay for high contrast and readability */
		              background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
		                          url('https://images.unsplash.com/photo-1517842645767-c639042777db?q=80&w=1920') no-repeat center center fixed;
		              background-size: cover;
		              font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		              color: #f8f9fa;
		              min-height: 100vh;
		              display: flex;
		              align-items: center;
		          }

		          .container {
		              max-width: 600px;
		          }

		          /* Modern Glassmorphism Card Effect */
		          .custom-card {
		              background: rgba(255, 255, 255, 0.5);
		              backdrop-filter: blur(12px);
		              -webkit-backdrop-filter: blur(12px);
		              border: 1px solid rgba(255, 255, 255, 0.15);
		              border-radius: 16px;
		              box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
		              padding: 2.5rem !important;
		          }

		          .form-title {
		              font-weight: 700;
		              letter-spacing: 0.5px;
		              color: #ffffff;
		              text-shadow: 0 2px 4px rgba(0,0,0,0.2);
		          }

		          .form-label {
		              font-weight: 500;
		              color: black;
		              font-size: 0.9rem;
		              margin-bottom: 0.5rem;
		          }

		          /* Sleek Modern Input Fields */
		          .form-control {
		              background: rgba(255, 255, 255, 0.5);
		              border: 1px solid rgba(255, 255, 255, 0.5);
		              color: #ffffff !important;
		              border-radius: 8px;
		              padding: 0.6rem 1rem;
		              transition: all 0.3s ease;
		          }

		          .form-control:focus {
		              background: rgba(255, 255, 255, 0.1);
		              border-color: #38bdf8;
		              box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
		          }

		          /* Adjust placeholder color for readability */
		          .form-control::placeholder {
		              color: rgba(255, 255, 255, 0.5);
		          }

		          /* Button Styling updates */
		          .btn {
		              border-radius: 8px;
		              padding: 0.6rem 1.5rem;
		              font-weight: 600;
		              transition: all 0.2s ease;
		          }

		          .btn-success {
		              background-color: #0ea5e9;
		              border: none;
					  color: black;
		          }

		          .btn-success:hover {
		              background-color: #0284c7;
		              transform: translateY(-1px);
		          }

		          .btn-secondary {
		              background-color: transparent;
		              border: 1px solid rgba(255, 255, 255, 0.3);
		              color: black;
		          }

		          .btn-secondary:hover {
		              background-color: rgba(255, 255, 255, 0.1);
		              border-color: #ffffff;
		              color: blue;
		              transform: translateY(-1px);
		          }
		      </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Add New Student</h2>

    <div class="card p-4">
        <form th:action="@{/students}" th:object="${student}" method="POST">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" th:field="*{name}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Course</label>
                <input type="text" th:field="*{course}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Roll Number</label>
                <input type="text" th:field="*{rollNumber}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" th:field="*{department}" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success">Save Student</button>
            <a th:href="@{/students}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
