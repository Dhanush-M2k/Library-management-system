<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Books - Library MS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f0f4ff 0%, #dce7f3 100%); min-height: 100vh; font-family: Inter, sans-serif; }
        .navbar { background: linear-gradient(90deg, #1e3a5f 0%, #2563eb 100%); }
        .nav-brand { font-size: 1.3rem; font-weight: 700; color: white !important; }
        .nav-link { color: rgba(255,255,255,0.85) !important; font-weight: 500; }
        .management-card { background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 2.5rem; margin-top: 2rem; }
        .table th { font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: .05em; padding: 1rem 1.25rem; background: #1e3a5f; color: #fff; }
        .table td { padding: .9rem 1.25rem; vertical-align: middle; }
        .table-hover tbody tr:hover { background-color: #f1f5f9; }
        .badge-avail { background:#dcfce7; color:#166534; padding: 4px 10px; border-radius:20px; font-size:0.78rem; font-weight:600; }
        .badge-low { background:#fef9c3; color:#854d0e; padding: 4px 10px; border-radius:20px; font-size:0.78rem; font-weight:600; }
        .badge-none { background:#fee2e2; color:#991b1b; padding: 4px 10px; border-radius:20px; font-size:0.78rem; font-weight:600; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-2">
    <div class="container">
        <a class="navbar-brand nav-brand" href="/dashboard"><i class="bi bi-book-half me-2"></i>LibraryMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link fw-bold text-white" href="/books"><i class="bi bi-journal-bookmark me-1"></i>Books</a></li>
                <li class="nav-item"><a class="nav-link" href="/members"><i class="bi bi-people me-1"></i>Members</a></li>
                <li class="nav-item"><a class="nav-link" href="/orders"><i class="bi bi-cart3 me-1"></i>Book Orders</a></li>
                <li class="nav-item"><a class="nav-link" href="/returns"><i class="bi bi-arrow-return-left me-1"></i>Returns</a></li>
                <li class="nav-item"><a class="nav-link" href="/students"><i class="bi bi-mortarboard me-1"></i>Students</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">
    <div class="management-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0"><i class="bi bi-journal-bookmark-fill text-primary me-2"></i>Book Details</h4>
            <a href="/books/new" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Add New Book</a>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" th:text="${errorMessage}" role="alert"></div>
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" th:text="${successMessage}" role="alert"></div>
        <div class="table-responsive">
            <table class="table table-hover table-bordered">
                <thead>
                <tr>
                    <th>#</th><th>Title</th><th>Author</th><th>ISBN</th><th>Genre</th>
                    <th>Publisher</th><th>Year</th><th>Total</th><th>Available</th><th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.id}"></td>
                    <td class="fw-semibold" th:text="${book.title}"></td>
                    <td th:text="${book.author}"></td>
                    <td><code th:text="${book.isbn}"></code></td>
                    <td th:text="${book.genre}"></td>
                    <td th:text="${book.publisher}"></td>
                    <td th:text="${book.publishedYear}"></td>
                    <td th:text="${book.totalCopies}"></td>
                    <td>
                        <span th:if="${book.availableCopies > 2}" class="badge-avail" th:text="${book.availableCopies}"></span>
                        <span th:if="${book.availableCopies == 1 or book.availableCopies == 2}" class="badge-low" th:text="${book.availableCopies}"></span>
                        <span th:if="${book.availableCopies == 0}" class="badge-none">Out of Stock</span>
                    </td>
                    <td>
                        <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-sm btn-outline-info"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Delete this book?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(books)}">
                    <td colspan="10" class="text-center text-muted py-4">No books found. <a href="/books/new">Add a book</a>.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
