<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Student</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
		  <!DOCTYPE html>
		  <html lang="en" xmlns:th="http://www.thymeleaf.org">
		  <head>
		      <meta charset="UTF-8">
		      <title>Update Student</title>
		      <link rel="stylesheet"
		            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
		      
		      <style>
		          body {
		              background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
		              min-height: 100vh;
		              display: flex;
		              align-items: center;
		              justify-content: center;
		              font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		              margin: 0;
		              padding: 20px 0;
		          }

		          .container {
		              max-width: 600px;
		          }

		          .card {
		              border: none;
		              border-radius: 15px;
		              box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
		              background: rgba(255, 255, 255, 0.95);
		              backdrop-filter: blur(10px);
		              transition: transform 0.2s ease, box-shadow 0.2s ease;
		          }

		          h2 {
		              color: #2c3e50;
		              font-weight: 700;
		              letter-spacing: -0.5px;
		              position: relative;
		              margin-bottom: 30px !important;
		          }

		          h2::after {
		              content: '';
		              display: block;
		              width: 50px;
		              height: 4px;
		              background: #198754; /* Matches btn-success */
		              margin: 8px auto 0 auto;
		              border-radius: 2px;
		          }

		          .form-label {
		              font-weight: 600;
		              color: #4a5568;
		              font-size: 0.9rem;
		              text-transform: uppercase;
		              letter-spacing: 0.5px;
		          }

		          .form-control {
		              border: 2px solid #e2e8f0;
		              border-radius: 8px;
		              padding: 10px 15px;
		              transition: all 0.3s ease;
		          }

		          .form-control:focus {
		              border-color: #198754;
		              box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.15);
		              
		          }

		          .btn {
		              padding: 10px 24px;
		              font-weight: 600;
		              border-radius: 8px;
		              transition: all 0.2s ease;
		          }

		          .btn-success {
		              background-color: #198754;
		              border: none;
		          }

		          .btn-success:hover {
		              background-color: #146c43;
		              transform: translateY(-1px);
		              box-shadow: 0 4px 12px rgba(25, 135, 84, 0.2);
		          }

		          .btn-secondary {
		              background-color: #6c757d;
		              border: none;
		          }

		          .btn-secondary:hover {
		              background-color: #5c636a;
		              transform: translateY(-1px);
		              box-shadow: 0 4px 12px rgba(108, 117, 125, 0.2);
		          }
		          
		          .button-group {
		              display: flex;
		              gap: 10px;
		              margin-top: 1.5rem;
		          }
		      </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Update Student</h2>

    <div class="card p-4">
        <form th:action="@{/students}" th:object="${student}" method="POST">

            <!-- Hidden field to keep track of the student id being updated -->
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" th:field="*{name}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Course</label>
                <input type="text" th:field="*{course}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Roll Number</label>
                <input type="text" th:field="*{rollNumber}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Department</label>
                <input type="text" th:field="*{department}" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success">Update Student</button>
            <a th:href="@{/students}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
